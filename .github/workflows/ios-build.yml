
name: VOIDCORE iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidcore-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VOIDCORE for iOS
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Xray
        run: |
          bash scripts/build_xray_ios.sh
          test -d ios/Frameworks/Xray.xcframework

      - name: Fetch Tor bridges
        run: |
          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            printf '{"country":"ir","bridges":[]}\n' > assets/tor/bridges.json
          fi


      - name: Validate Xcode Scheme
        run: |
          set -euo pipefail

          echo "Checking Runner.xcscheme XML..."
          xmllint --noout ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          echo "Listing Xcode targets and schemes..."
          xcodebuild -list -project ios/Runner.xcodeproj

          echo "Checking Runner target ID..."
          grep -n "A0000000329A555163379275" ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          echo "Checking PacketTunnel target ID..."
          grep -n "A000000040A7B40E7E2BCA5C" ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package app
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p dist
          ARCHIVE="VOIDCORE-iOS-${VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.zip"
          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app "dist/$ARCHIVE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: VOIDCORE iOS v${{ env.VERSION }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Automated VOIDCORE iOS build.

            Version: ${{ env.VERSION }}
            Build: ${{ github.run_number }}

            This is an unsigned iOS build.
          files: dist/*.zip
          draft: false
          prerelease: true
