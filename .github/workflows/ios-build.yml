name: VOIDCORE iOS Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "sync/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidcore-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ios:
    name: Build VOIDCORE for iOS
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache-dependency-path: xray/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Xcode project and scheme
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = project.read_text(encoding="utf-8-sig")

          # Remove anything after the root project closing section.
          match = re.search(
              r'\n[ \t]*rootObject[ \t]*=.*?;\n}',
              content,
              re.DOTALL
          )

          if not match:
              raise SystemExit("ERROR: Could not find rootObject.")

          fixed = content[:match.end()] + "\n"

          # Fix PacketTunnelProvider.swift path.
          wrong_path = 'path = "PacketTunnel/PacketTunnelProvider.swift";'
          correct_path = 'path = "PacketTunnelProvider.swift";'

          if wrong_path in fixed:
              fixed = fixed.replace(wrong_path, correct_path, 1)
              print("Fixed PacketTunnelProvider.swift path.")
          elif correct_path in fixed:
              print("PacketTunnelProvider.swift path is already correct.")
          else:
              raise SystemExit("ERROR: PacketTunnelProvider.swift reference not found.")

          # Fix all file references inside Runner and PacketTunnel groups.
          path_fixes = {
              # Runner group files
              "Runner/AppDelegate.swift": "AppDelegate.swift",
              "Runner/VpnController.swift": "VpnController.swift",
              "Runner/VpnConfig.swift": "VpnConfig.swift",
              "Runner/SharedContainer.swift": "SharedContainer.swift",
              "Runner/XrayCoreBridge.swift": "XrayCoreBridge.swift",
              "Runner/XrayCoreProbe.swift": "XrayCoreProbe.swift",
              "Runner/AppStatePoller.swift": "AppStatePoller.swift",
              "Runner/KeychainStore.swift": "KeychainStore.swift",
              "Runner/DocumentPicker.swift": "DocumentPicker.swift",
              "Runner/DocumentSaver.swift": "DocumentSaver.swift",
              "Runner/Info.plist": "Info.plist",
              "Runner/Runner.entitlements": "Runner.entitlements",
              "Runner/Debug.entitlements": "Debug.entitlements",
              "Runner/Release.entitlements": "Release.entitlements",
              "Runner/Runner-Bridging-Header.h": "Runner-Bridging-Header.h",
              "Runner/Assets.xcassets": "Assets.xcassets",

              # Base.lproj group files
              "Runner/Base.lproj/Main.storyboard": "Main.storyboard",
              "Runner/Base.lproj/LaunchScreen.storyboard": "LaunchScreen.storyboard",

              # PacketTunnel group files
              "PacketTunnel/Info.plist": "Info.plist",
              "PacketTunnel/PacketTunnel.entitlements": "PacketTunnel.entitlements",
          }

          for old_path, new_path in path_fixes.items():
              old_reference = f'path = "{old_path}";'
              new_reference = f'path = "{new_path}";'

              if old_reference in fixed:
                  fixed = fixed.replace(
                      old_reference,
                      new_reference,
                      1
                  )
                  print(f"Fixed file reference: {old_path}")
              elif new_reference in fixed:
                  print(f"Already correct: {new_path}")
              else:
                  raise SystemExit(
                      f"ERROR: File reference not found: {old_path}"
                  )

          print("All Runner and PacketTunnel file paths repaired.")

          # Rebuild the complete Sources build phases section.
          sources_section = """/* Begin PBXSourcesBuildPhase section */
                  A000000076B214DA316909B0 /* Sources */ = {
                          isa = PBXSourcesBuildPhase;
                          buildActionMask = 2147483647;
                          files = (
                                  A0000000141EF5E307D70344 /* AppDelegate.swift in Sources */,
                                  A000000009867EDD25086162 /* VpnController.swift in Sources */,
                                  A000000005DB204CE76B7141 /* VpnConfig.swift in Sources */,
                                  A000000074C3AE40F4786CA7 /* SharedContainer.swift in Sources */,
                                  A00000004B5835A5373BEBC2 /* XrayCoreBridge.swift in Sources */,
                                  A00000000037005F6264576E /* XrayCoreProbe.swift in Sources */,
                                  A00000005B40D9EDC7C0E816 /* AppStatePoller.swift in Sources */,
                                  A00000000BAB8D0FD2C5E57F /* KeychainStore.swift in Sources */,
                                  A000000067C48C1B326E8A2B /* DocumentPicker.swift in Sources */,
                                  A0000000607330DE23ECF6F1 /* DocumentSaver.swift in Sources */,
                                  B30000000000000000000001 /* GeneratedPluginRegistrant.m in Sources */,
                          );
                          runOnlyForDeploymentPostprocessing = 0;
                  };
                  A0000000344123F412D6C744 /* Sources */ = {
                          isa = PBXSourcesBuildPhase;
                          buildActionMask = 2147483647;
                          files = (
                                  A0000000635AE671217C7351 /* PacketTunnelProvider.swift in Sources */,
                                  B20000000000000000000001 /* VpnConfig.swift in PacketTunnel Sources */,
                                  B20000000000000000000002 /* SharedContainer.swift in PacketTunnel Sources */,
                                  B20000000000000000000003 /* XrayCoreBridge.swift in PacketTunnel Sources */,
                                  B20000000000000000000004 /* XrayCoreProbe.swift in PacketTunnel Sources */,
                          );
                          runOnlyForDeploymentPostprocessing = 0;
                  };
          /* End PBXSourcesBuildPhase section */"""

          pattern = (
              r'/\* Begin PBXSourcesBuildPhase section \*/'
              r'.*?'
              r'/\* End PBXSourcesBuildPhase section \*/'
          )

          fixed, replacements = re.subn(
              pattern,
              lambda _: sources_section,
              fixed,
              count=1,
              flags=re.DOTALL
          )

          if replacements != 1:
              raise SystemExit("ERROR: Could not repair Sources build phase.")

          print("Sources build phase repaired.")

                    # Add the actual iOS Xray framework slice to search paths.
          old_search_path = '"$(PROJECT_DIR)/Frameworks",'
          new_search_path = (
              '"$(PROJECT_DIR)/Frameworks",\n'
              '                    "$(PROJECT_DIR)/Frameworks/Xray.xcframework/ios-arm64",'
          )

          count = fixed.count(old_search_path)

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find FRAMEWORK_SEARCH_PATHS."
              )

          fixed = fixed.replace(old_search_path, new_search_path)

          print(f"Added Xray framework slice to {count} search paths.")

          # The Flutter pod's xcconfig does not expose the engine XCFramework
          # directory in FRAMEWORK_SEARCH_PATHS on this generated project.
          # Add the device slice to Runner only (never to PacketTunnel).
          runner_config_ids = [
              "A000000038682949FE1D5078",  # Runner Debug
              "A00000002EE560E7D7A9794D",  # Runner Release
          ]

          for config_id in runner_config_ids:
              marker = f"{config_id} /*"
              config_start = fixed.find(marker)
              if config_start < 0:
                  raise SystemExit(f"ERROR: Runner configuration {config_id} not found.")

              search_start = fixed.find("FRAMEWORK_SEARCH_PATHS = (", config_start)
              if search_start < 0:
                  raise SystemExit(f"ERROR: FRAMEWORK_SEARCH_PATHS missing in {config_id}.")

              search_end = fixed.find(");", search_start)
              if search_end < 0:
                  raise SystemExit(f"ERROR: FRAMEWORK_SEARCH_PATHS is unterminated in {config_id}.")

              search_block = fixed[search_start:search_end]
              flutter_path = '"$(FLUTTER_ROOT)/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64",'
              if flutter_path not in search_block:
                  fixed = (
                      fixed[:search_end]
                      + '\n                    '
                      + flutter_path
                      + fixed[search_end:]
                  )


          print("Added Flutter iOS device framework search path to Runner Debug/Release.")

          # Flutter is provided by the Flutter CocoaPods integration.
          # Do not inject a global -framework Flutter flag: it also affects
          # PacketTunnel, which must not link the Flutter engine.

          # Link libresolv for Xray DNS resolver symbols.
          if '"-lresolv",' not in fixed:
              linker_flag = '"-ObjC",'
              count = fixed.count(linker_flag)
              if count == 0:
                  raise SystemExit("ERROR: Could not find OTHER_LDFLAGS.")
              fixed = fixed.replace(
                  linker_flag,
                  '"-ObjC",\n                    "-lresolv",'
              )
              print(f"Added -lresolv to {count} linker configurations.")
          else:
              print("-lresolv is already configured.")


          # Fix Runner target base configuration references.
          # Debug and Release must use their Flutter xcconfig files,
          # not their code-signing entitlement files.

          configuration_fixes = {
              'baseConfigurationReference = A00000005722C96E98EF152C /* Debug.entitlements */;':
              'baseConfigurationReference = B10000000000000000000001 /* Debug.xcconfig */;',

              'baseConfigurationReference = A00000000CA5219A325E2070 /* Release.entitlements */;':
              'baseConfigurationReference = B10000000000000000000002 /* Release.xcconfig */;',
          }

          for old_reference, new_reference in configuration_fixes.items():
              count = fixed.count(old_reference)

              if count == 1:
                  fixed = fixed.replace(old_reference, new_reference, 1)
                  print(f"Fixed Xcode configuration: {new_reference}")
              elif fixed.count(new_reference) == 1:
                  print(f"Already correct: {new_reference}")
              else:
                  raise SystemExit(
                      f"ERROR: Expected one old or one corrected Xcode reference; "
                      f"found old={count}, corrected={fixed.count(new_reference)}"
                  )

          print("Runner Debug and Release configurations verified.")

          project.write_text(fixed, encoding="utf-8")
          print("Xcode project saved.")

          provider = Path("ios/PacketTunnel/PacketTunnelProvider.swift")

          if not provider.is_file():
              raise SystemExit("ERROR: PacketTunnelProvider.swift is missing.")

          print("PacketTunnelProvider.swift exists.")

          scheme = Path(
              "ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme"
          )

          raw = scheme.read_bytes()
          raw = raw.lstrip(b"\xef\xbb\xbf \t\r\n")
          scheme.write_bytes(raw)

          print("Runner scheme normalized.")
          PY

          echo "Checking scheme XML..."
          xmllint --noout ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          echo "Checking Xcode project..."
          xcodebuild -list -project ios/Runner.xcodeproj

          echo "Xcode project validation completed."

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          echo "Checking Flutter iOS configuration..."

          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Release.xcconfig

          echo "Checking Generated.xcconfig..."

          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "ERROR: Generated.xcconfig was not generated."
            exit 1
          fi

          grep -E 'FLUTTER_ROOT=' ios/Flutter/Generated.xcconfig

          echo "Flutter configuration verified."

      - name: Build Xray framework
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Xray for iOS..."
          bash scripts/build_xray_ios.sh device

          FRAMEWORK="ios/Frameworks/Xray.xcframework"

          if [ ! -d "$FRAMEWORK" ]; then
            echo "ERROR: Xray.xcframework was not generated."
            exit 1
          fi

          echo "Checking framework contents..."
          find "$FRAMEWORK" -maxdepth 4 -print

          if [ ! -f "$FRAMEWORK/ios-arm64/Xray.framework/Xray" ]; then
            echo "ERROR: iOS device Xray binary is missing."
            exit 1
          fi

          echo "Xray device framework verified."

      - name: Fetch Tor bridges
        shell: bash
        run: |
          set -euo pipefail

          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            printf '{"country":"ir","bridges":[]}\n' \
              > assets/tor/bridges.json
            echo "Using fallback Tor configuration."
          fi

          test -f assets/tor/bridges.json

      - name: Build iOS Release
        shell: bash
        run: |
          set -euo pipefail

          cd ios
          pod install --repo-update
          cd ..

          echo "Inspecting Flutter pod integration..."
          test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          grep -nE 'FRAMEWORK_SEARCH_PATHS|Flutter' \
            "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" || true
          find "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios" \
            -maxdepth 4 \( -name Flutter.framework -o -name Flutter.xcframework \) -print

          echo "Resolved Runner release build settings..."
          BUILD_SETTINGS="$(xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -showBuildSettings)"
          printf '%s\\n' "$BUILD_SETTINGS" | grep -E '(^| )FRAMEWORK_SEARCH_PATHS =|^ *FLUTTER_ROOT =|^ *PODS_ROOT ='

          if ! printf '%s\\n' "$BUILD_SETTINGS" | grep -Fq 'Flutter.xcframework/ios-arm64'; then
            echo "ERROR: Runner cannot see the Flutter iOS device framework."
            exit 1
          fi

          flutter build ios --release --no-codesign

          test -d build/ios/iphoneos/Runner.app

          echo "iOS build completed successfully."

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read app version."
            exit 1
          fi

          mkdir -p dist

          ARCHIVE="VOIDCORE-iOS-${VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.zip"

          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app \
            "dist/$ARCHIVE"

          echo "Created: dist/$ARCHIVE"
          ls -lh "dist/$ARCHIVE"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS-${{ github.run_number }}-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: VOIDCORE iOS Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            ## VOIDCORE iOS

            Automated iOS build.

            - Version: ${{ github.run_number }}
            - Build: Unsigned
            - Platform: iOS

            This build was generated by GitHub Actions.
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
