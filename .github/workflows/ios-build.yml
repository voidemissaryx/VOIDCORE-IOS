
name: VOIDCORE iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build VOIDCORE iOS
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Xray
        run: bash scripts/build_xray_ios.sh

      - name: Fetch Tor bridges
        run: |
          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            echo '{"country":"ir","bridges":[]}' > assets/tor/bridges.json
          fi

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS
          path: build/ios/iphoneos/Runner.app
