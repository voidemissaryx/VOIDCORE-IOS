name: VOIDCORE iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidcore-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VOIDCORE for iOS
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Xray
        run: |
          bash scripts/build_xray_ios.sh
          test -d ios/Frameworks/Xray.xcframework

      - name: Fetch Tor bridges
        run: |
          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            printf '{"country":"ir","bridges":[]}\n' > assets/tor/bridges.json
          fi

      - name: Check Scheme First Bytes
        run: |
          echo "First bytes of Runner.xcscheme:"
          xxd -l 32 ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
  
      - name: Validate Xcode Scheme
        run: |
          set -euo pipefail

          SCHEME="ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme"

          echo "Removing BOM and leading whitespace..."

          python3 -c '
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme")
          content = path.read_bytes()
          content = content.lstrip(b"\xef\xbb\xbf \t\r\n")
          path.write_bytes(content)
          '

          echo "Checking Runner.xcscheme XML..."
          xmllint --noout "$SCHEME"

          echo "Listing Xcode targets and schemes..."
          xcodebuild -list -project ios/Runner.xcodeproj

          echo "Checking Runner target ID..."
          grep -n "A0000000329A555163379275" "$SCHEME"

          echo "Scheme validation completed successfully."
          
      - name: Repair Xcode project file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = path.read_text(encoding="utf-8-sig")

          match = re.search(
              r'\n[ \t]*rootObject[ \t]*=.*?;\n}',
              content,
              re.DOTALL
          )

          if not match:
              raise SystemExit("ERROR: Could not find the project rootObject.")

          fixed = content[:match.end()] + "\n"
          path.write_text(fixed, encoding="utf-8")

          print("Xcode project repaired successfully.")
          print(f"Original size: {len(content.splitlines())} lines")
          print(f"Fixed size: {len(fixed.splitlines())} lines")
          PY

      - name: Package app
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p dist
          ARCHIVE="VOIDCORE-iOS-${VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.zip"
          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app "dist/$ARCHIVE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: VOIDCORE iOS v${{ env.VERSION }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Automated VOIDCORE iOS build.

            Version: ${{ env.VERSION }}
            Build: ${{ github.run_number }}

            This is an unsigned iOS build.
          files: dist/*.zip
          draft: false
          prerelease: true
