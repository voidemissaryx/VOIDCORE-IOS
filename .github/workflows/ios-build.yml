name: VOIDCORE iOS Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidcore-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VOIDCORE for iOS
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache-dependency-path: xray/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Xcode project and scheme
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = project.read_text(encoding="utf-8-sig")

          match = re.search(
              r'\n[ \t]*rootObject[ \t]*=.*?;\n}',
              content,
              re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: Could not find a complete Xcode project rootObject."
              )

          fixed = content[:match.end()] + "\n"

          wrong_path = 'path = "PacketTunnel/PacketTunnelProvider.swift";'
          correct_path = 'path = "PacketTunnelProvider.swift";'

          if wrong_path in fixed:
              fixed = fixed.replace(wrong_path, correct_path, 1)
              print("Fixed PacketTunnelProvider.swift path.")
          elif correct_path in fixed:
              print("PacketTunnelProvider.swift path is already correct.")
          else:
              raise SystemExit(
                  "ERROR: PacketTunnelProvider.swift reference was not found."
              )

          project.write_text(fixed, encoding="utf-8")

          print("Xcode project repaired.")
          print(f"Project lines: {len(fixed.splitlines())}")

          provider = Path("ios/PacketTunnel/PacketTunnelProvider.swift")
          if not provider.is_file():
              raise SystemExit(
                  "ERROR: Actual PacketTunnelProvider.swift file is missing."
              )

          print("PacketTunnelProvider.swift exists.")

          scheme = Path(
              "ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme"
          )

          raw = scheme.read_bytes()
          raw = raw.lstrip(b"\xef\xbb\xbf \t\r\n")
          scheme.write_bytes(raw)

          print("Runner scheme normalized.")
          PY

          echo "Checking project file..."
          plutil -lint ios/Runner.xcodeproj/project.pbxproj

          echo "Checking scheme XML..."
          xmllint --noout ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          echo "Checking Xcode targets..."
          xcodebuild -list -project ios/Runner.xcodeproj

      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Build Xray framework
        run: |
          set -euo pipefail
          bash scripts/build_xray_ios.sh
          test -d ios/Frameworks/Xray.xcframework
          echo "Xray framework built successfully."

      - name: Fetch Tor bridges
        shell: bash
        run: |
          set -euo pipefail

          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            printf '{"country":"ir","bridges":[]}\n' \
              > assets/tor/bridges.json
            echo "Using fallback Tor configuration."
          fi

          test -f assets/tor/bridges.json

      - name: Build iOS Release
        run: |
          set -euo pipefail

          flutter build ios --release --no-codesign

          test -d build/ios/iphoneos/Runner.app

          echo "iOS build completed successfully."

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read app version."
            exit 1
          fi

          mkdir -p dist

          ARCHIVE="VOIDCORE-iOS-${VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.zip"

          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app \
            "dist/$ARCHIVE"

          echo "Created: dist/$ARCHIVE"
          ls -lh "dist/$ARCHIVE"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS-${{ github.run_number }}-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: VOIDCORE iOS Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            ## VOIDCORE iOS

            Automated iOS build.

            - Version: ${{ github.run_number }}
            - Build: Unsigned
            - Platform: iOS

            This build was generated by GitHub Actions.
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
