name: VOIDCORE iOS Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidcore-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VOIDCORE for iOS
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache-dependency-path: xray/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Xcode project and scheme
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = project.read_text(encoding="utf-8-sig")

          # Remove anything after the root project closing section.
          match = re.search(
              r'\n[ \t]*rootObject[ \t]*=.*?;\n}',
              content,
              re.DOTALL
          )

          if not match:
              raise SystemExit("ERROR: Could not find rootObject.")

          fixed = content[:match.end()] + "\n"

          # Fix PacketTunnelProvider.swift path.
          wrong_path = 'path = "PacketTunnel/PacketTunnelProvider.swift";'
          correct_path = 'path = "PacketTunnelProvider.swift";'

          if wrong_path in fixed:
              fixed = fixed.replace(wrong_path, correct_path, 1)
              print("Fixed PacketTunnelProvider.swift path.")
          elif correct_path in fixed:
              print("PacketTunnelProvider.swift path is already correct.")
          else:
              raise SystemExit("ERROR: PacketTunnelProvider.swift reference not found.")

          # Fix shared Swift files paths.
          swift_files = [
              "VpnConfig.swift",
              "SharedContainer.swift",
              "XrayCoreBridge.swift",
              "XrayCoreProbe.swift",
          ]

          for filename in swift_files:
              old_path = f'path = "Runner/{filename}";'
              new_path = f'path = "{filename}";'

              if old_path in fixed:
                  fixed = fixed.replace(old_path, new_path, 1)
                  print(f"Fixed path: {filename}")
              elif new_path in fixed:
                  print(f"Path already correct: {filename}")
              else:
                  raise SystemExit(
                      f"ERROR: Could not find file reference for {filename}"
                  )

          # Rebuild the complete Sources build phases section.
          sources_section = """/* Begin PBXSourcesBuildPhase section */
                  A000000076B214DA316909B0 /* Sources */ = {
                          isa = PBXSourcesBuildPhase;
                          buildActionMask = 2147483647;
                          files = (
                                  A0000000141EF5E307D70344 /* AppDelegate.swift in Sources */,
                                  A000000009867EDD25086162 /* VpnController.swift in Sources */,
                                  A000000005DB204CE76B7141 /* VpnConfig.swift in Sources */,
                                  A000000074C3AE40F4786CA7 /* SharedContainer.swift in Sources */,
                                  A00000004B5835A5373BEBC2 /* XrayCoreBridge.swift in Sources */,
                                  A00000000037005F6264576E /* XrayCoreProbe.swift in Sources */,
                                  A00000005B40D9EDC7C0E816 /* AppStatePoller.swift in Sources */,
                                  A00000000BAB8D0FD2C5E57F /* KeychainStore.swift in Sources */,
                                  A000000067C48C1B326E8A2B /* DocumentPicker.swift in Sources */,
                                  A0000000607330DE23ECF6F1 /* DocumentSaver.swift in Sources */,
                          );
                          runOnlyForDeploymentPostprocessing = 0;
                  };
                  A0000000344123F412D6C744 /* Sources */ = {
                          isa = PBXSourcesBuildPhase;
                          buildActionMask = 2147483647;
                          files = (
                                  A0000000635AE671217C7351 /* PacketTunnelProvider.swift in Sources */,
                                  B20000000000000000000001 /* VpnConfig.swift in PacketTunnel Sources */,
                                  B20000000000000000000002 /* SharedContainer.swift in PacketTunnel Sources */,
                                  B20000000000000000000003 /* XrayCoreBridge.swift in PacketTunnel Sources */,
                                  B20000000000000000000004 /* XrayCoreProbe.swift in PacketTunnel Sources */,
                          );
                          runOnlyForDeploymentPostprocessing = 0;
                  };
          /* End PBXSourcesBuildPhase section */"""

          pattern = (
              r'/\* Begin PBXSourcesBuildPhase section \*/'
              r'.*?'
              r'/\* End PBXSourcesBuildPhase section \*/'
          )

          fixed, replacements = re.subn(
              pattern,
              lambda _: sources_section,
              fixed,
              count=1,
              flags=re.DOTALL
          )

          if replacements != 1:
              raise SystemExit("ERROR: Could not repair Sources build phase.")

          print("Sources build phase repaired.")

          project.write_text(fixed, encoding="utf-8")
          print("Xcode project saved.")

          provider = Path("ios/PacketTunnel/PacketTunnelProvider.swift")

          if not provider.is_file():
              raise SystemExit("ERROR: PacketTunnelProvider.swift is missing.")

          print("PacketTunnelProvider.swift exists.")

          scheme = Path(
              "ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme"
          )

          raw = scheme.read_bytes()
          raw = raw.lstrip(b"\xef\xbb\xbf \t\r\n")
          scheme.write_bytes(raw)

          print("Runner scheme normalized.")
          PY

          echo "Checking scheme XML..."
          xmllint --noout ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

          echo "Checking Xcode project..."
          xcodebuild -list -project ios/Runner.xcodeproj

          echo "Xcode project validation completed."

      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Build Xray framework
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Xray for iOS..."
          bash scripts/build_xray_ios.sh device

          FRAMEWORK="ios/Frameworks/Xray.xcframework"

          if [ ! -d "$FRAMEWORK" ]; then
            echo "ERROR: Xray.xcframework was not generated."
            exit 1
          fi

          echo "Checking framework contents..."
          find "$FRAMEWORK" -maxdepth 4 -print

          if [ ! -f "$FRAMEWORK/ios-arm64/Xray.framework/Xray" ]; then
            echo "ERROR: iOS device Xray binary is missing."
            exit 1
          fi

          echo "Xray device framework verified."

      - name: Fetch Tor bridges
        shell: bash
        run: |
          set -euo pipefail

          if ! bash scripts/fetch_tor_bridges.sh; then
            mkdir -p assets/tor
            printf '{"country":"ir","bridges":[]}\n' \
              > assets/tor/bridges.json
            echo "Using fallback Tor configuration."
          fi

          test -f assets/tor/bridges.json

      - name: Build iOS Release
        run: |
          set -euo pipefail

          flutter build ios --release --no-codesign

          test -d build/ios/iphoneos/Runner.app

          echo "iOS build completed successfully."

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read app version."
            exit 1
          fi

          mkdir -p dist

          ARCHIVE="VOIDCORE-iOS-${VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.zip"

          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app \
            "dist/$ARCHIVE"

          echo "Created: dist/$ARCHIVE"
          ls -lh "dist/$ARCHIVE"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-iOS-${{ github.run_number }}-unsigned
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: VOIDCORE iOS Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            ## VOIDCORE iOS

            Automated iOS build.

            - Version: ${{ github.run_number }}
            - Build: Unsigned
            - Platform: iOS

            This build was generated by GitHub Actions.
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
